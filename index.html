<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMEGA185</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 8%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 25px;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .hero h1 {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 19px;
      color: #aaa;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: white;
      color: black;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.25s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 700px) {
      nav {
        display: none;
      }

      .hero h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">OMEGA185</div>

    <nav>
      <a href="#">Главная</a>
      <a href="#">Интересное</a>
      <a href="#">О сайте</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Добро пожаловать</h1>

    <p>
      Здесь скоро появится что-то интересное.
      Сейчас я создаю этот сайт с нуля.
    </p>

    <a href="#" class="button">Смотреть</a>
  </main>

  <footer>
    © 2026 OMEGA185
  </footer>

</body>
</html>
